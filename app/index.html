<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toon Anvil</title>
<meta name="description" content="Build, play and log D&amp;D 2024 characters, with first-class homebrew.">
<meta name="theme-color" content="#221a11">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<!-- Apply the chosen theme before the stylesheet paints, or a candlelight
     user gets one parchment flash on every load. ui/theme.js owns the rest. -->
<script>try{var t=localStorage.getItem('toonanvil.theme');
if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;
document.documentElement.dataset.seat=
localStorage.getItem('toonanvil.role')==='dm'?'dm':'player'}catch(e){}</script>
<link rel="stylesheet" href="./ui/design.css">
</head>
<body>
<div id="app">
  <div id="chrome" class="chrome">
    <header class="topbar">
      <div class="brand">Toon<em>Anvil</em></div>
      <button id="seat" class="seat-plaque" type="button"></button>
      <nav class="modes" id="modes" aria-label="Modes"></nav>
    </header>
    <div id="ribbon" class="ribbon" hidden></div>
    <!-- Shown when the server stops answering. Lives in the chrome rather
         than a mode, because the point is that it is true whatever screen
         you are looking at. -->
    <div id="serverdown" class="serverdown" role="alert" hidden></div>
  </div>
  <!-- The screen's nameplate: painted by renderMode, outside <main> so the
       modes (which own and wipe #view) and the gym's main-scoped text
       probes never collide with it. Dumb text only - no controls. -->
  <div id="modehead" class="modehead" hidden></div>
  <main id="view" tabindex="-1">
    <div class="empty">Loading&hellip;</div>
  </main>
</div>
<div id="toast" hidden></div>
<div id="rollcards" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
